<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WorldSpeak</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e8eef5;
      --muted: #9aabbc;
      --accent: #d4a15a;
      --line: #2c3846;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #243041, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: 0.02em; }
    .sub { color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
    .scene { white-space: pre-wrap; line-height: 1.55; margin-bottom: 16px; }
    .choices { display: grid; gap: 8px; }
    button {
      appearance: none;
      border: 1px solid var(--line);
      background: #121820;
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary {
      background: var(--accent);
      color: #1a140a;
      border-color: var(--accent);
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #121820;
      color: var(--text);
      margin-bottom: 8px;
    }
    code { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>WorldSpeak</h1>
    <p class="sub">
      세계관 RAG + 세션 플래그 + Narrator / ConsistencyCritic.<br />
      API 키 없으면 <code>mock</code> 모드로 동작합니다.
    </p>
    <div class="panel">
      <div class="meta" id="meta">세션 준비 중…</div>
      <div class="scene" id="scene">시작을 누르면 Hook Street에서 Mira를 만납니다.</div>
      <div class="choices" id="choices"></div>
      <div style="margin-top:12px">
        <input id="custom" placeholder="직접 입력 (예: Bargain with information)" />
        <button class="primary" id="send">보내기</button>
      </div>
    </div>
  </main>
  <script>
    let sessionId = null;

    function render(data) {
      sessionId = data.session_id;
      document.getElementById("meta").textContent =
        `turn ${data.turn} · ${data.location} · ${data.llm_mode}` +
        (data.retrieved_docs?.length ? ` · rag: ${data.retrieved_docs.join(", ")}` : "") +
        (data.critique ? ` · critic: ${data.critique}` : "");
      document.getElementById("scene").textContent = data.scene;
      const box = document.getElementById("choices");
      box.innerHTML = "";
      (data.choices || []).forEach((choice) => {
        const btn = document.createElement("button");
        btn.textContent = choice;
        btn.onclick = () => turn(choice);
        box.appendChild(btn);
      });
    }

    async function turn(message) {
      const res = await fetch("/api/turn", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message }),
      });
      if (!res.ok) {
        alert("요청 실패: " + res.status);
        return;
      }
      render(await res.json());
    }

    document.getElementById("send").onclick = () => {
      const value = document.getElementById("custom").value.trim();
      if (!value) return;
      document.getElementById("custom").value = "";
      turn(value);
    };

    turn("Look around Hook Street");
  </script>
</body>
</html>
